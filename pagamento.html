<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Book AI · Pagamento</title>
  <style>
    :root { --brand: #D75341; --ink: #1A1512; --muted: #5A514B; --bg: #F6F1ED; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #FAF6F3; --muted: #B6AAA2; --bg: #14100E; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px; background: var(--bg);
      color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 380px; }
    .icon { font-size: 52px; margin-bottom: 8px; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { color: var(--muted); line-height: 1.5; font-size: 15px; margin: 0 0 24px; }
    a.btn {
      display: block; padding: 16px; border-radius: 16px; background: var(--brand);
      color: #fff; text-decoration: none; font-weight: 800; font-size: 16px;
    }
    small { display: block; margin-top: 18px; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
  </style>
</head>
<body>
  <main>
    <div class="icon">👑</div>
    <h1>Pagamento enviado</h1>
    <p>Volta ao Book AI. A tua Conta Premium activa-se sozinha assim que a
       operadora confirmar o pagamento.</p>
    <a class="btn" id="voltar"
       href="intent://premium/callback#Intent;scheme=bookai;package=com.ukhuluvela.bookai;end">
      Voltar ao Book AI
    </a>
    <small>Se o botão não abrir o app, abre o Book AI à mão: o pagamento
       continua a ser verificado.</small>
  </main>
  <script>
    // Tenta reabrir o app sem toque. Alguns navegadores bloqueiam isto;
    // nesse caso fica o botão.
    (function () {
      var android = /android/i.test(navigator.userAgent);
      var target = android
        ? "intent://premium/callback#Intent;scheme=bookai;package=com.ukhuluvela.bookai;end"
        : "bookai://premium/callback";
      document.getElementById("voltar").href = target;
      setTimeout(function () { window.location.href = target; }, 400);
    })();
  </script>
</body>
</html>
